events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Upstream services
    upstream interview_service {
        server interview-service:8000;
    }

    upstream auth_service {
        server auth-service:8087;
    }

    upstream vacancy_service {
        server vacancy-service:8086;
    }

    server {
        listen 80;
        server_name localhost;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;

        # CORS headers
        add_header Access-Control-Allow-Origin "localhost:3000" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, User-Agent, Cache-Control" always;

        # Interview Service - переписываем путь
        location /interview/ {
            rewrite ^/interview/(.*) /$1 break;
            proxy_pass http://interview_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /interview;
            
            # Для SSE (Server-Sent Events)
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Auth Service - переписываем путь
        location /auth/ {
            rewrite ^/auth/(.*) /$1 break;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /auth;
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Vacancy Service - переписываем путь
        location /vacancy/ {
            rewrite ^/vacancy/(.*) /$1 break;
            proxy_pass http://vacancy_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /vacancy;
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Health checks
        location /health/interview {
            proxy_pass http://interview_service/health;
        }

        location /health/auth {
            proxy_pass http://auth_service/health;
        }

        location /health/vacancy {
            proxy_pass http://vacancy_service/health;
        }

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 404 '{"error": "Not Found", "message": "Use /interview/, /auth/ or /vacancy/ endpoints"}';
            add_header Content-Type application/json;
        }
    }
}
