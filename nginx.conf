events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 6500;

    # Upstream services
    upstream interview_service {
        server interview-service:8000;
    }

    upstream auth_service {
        server auth-service:8080;
    }

    upstream vacancy_service {
        server vacancy-service:8086;
    }

    server {
        listen 80;
        server_name localhost;

        proxy_connect_timeout 6000s;
        proxy_send_timeout 6000s;
        proxy_read_timeout 6000s;
        proxy_buffering off;

        # Глобальные настройки для cookies
        proxy_cookie_path / "/; secure; SameSite=Lax";
        proxy_cookie_domain ~^(.*)$ $1;

        # Глобальные CORS headers
        add_header Access-Control-Allow-Origin "http://localhost:3000" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, User-Agent, Cache-Control" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age 3600 always;

        # Interview Service
        location /interview/ {
            # OPTIONS обработка для CORS preflight
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "http://localhost:3000";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, User-Agent, Cache-Control";
                add_header Access-Control-Allow-Credentials "true";
                add_header Access-Control-Max-Age 3600;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 200;
            }

            rewrite ^/interview/(.*) /$1 break;
            proxy_pass http://interview_service;
            
            # Headers для прокси
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
            
            # Передача cookies
            proxy_set_header Cookie $http_cookie;
            proxy_pass_request_headers on;
            proxy_pass_request_body on;
            
            # Специальные настройки для SSE
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
        }

        # Auth Service
        location /auth/ {
            # OPTIONS обработка для CORS preflight
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "http://localhost:3000";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, User-Agent, Cache-Control";
                add_header Access-Control-Allow-Credentials "true";
                add_header Access-Control-Max-Age 3600;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 200;
            }

            rewrite ^/auth/(.*) /$1 break;
            proxy_pass http://auth_service;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # Передача cookies
            proxy_set_header Cookie $http_cookie;
            proxy_pass_request_headers on;
            proxy_pass_request_body on;
        }

        # Vacancy Service - УЛУЧШЕННАЯ КОНФИГУРАЦИЯ
        location /vacancy/ {
            # OPTIONS обработка для CORS preflight
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "http://localhost:3000";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, User-Agent, Cache-Control";
                add_header Access-Control-Allow-Credentials "true";
                add_header Access-Control-Max-Age 3600;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 200;
            }

            rewrite ^/vacancy/(.*) /$1 break;
            proxy_pass http://vacancy_service;
            
            # Основные headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
            
            # КРИТИЧЕСКИ ВАЖНО для передачи cookies в vacancy_service
            proxy_set_header Cookie $http_cookie;
            proxy_pass_request_headers on;
            proxy_pass_request_body on;
            
            # Дополнительные настройки для надежной передачи cookies
            proxy_redirect off;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Host $host;
            
            # Логирование для дебага (можно убрать после исправления)
            access_log /var/log/nginx/vacancy_access.log main;
        }

        # Health checks
        location /health/interview {
            proxy_pass http://interview_service/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health/auth {
            proxy_pass http://auth_service/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health/vacancy {
            proxy_pass http://vacancy_service/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Cookie $http_cookie; # Добавляем cookies для health check
        }

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Дефолтный обработчик
        location / {
            # OPTIONS обработка для корневого пути
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "http://localhost:3000";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin, User-Agent, Cache-Control";
                add_header Access-Control-Allow-Credentials "true";
                add_header Access-Control-Max-Age 3600;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 200;
            }
            
            return 404 '{"error": "Not Found", "message": "Use /interview/, /auth/ or /vacancy/ endpoints"}';
            add_header Content-Type application/json;
        }
    }
}